<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Opción 1</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>
        <div class="container">
            <br>
            <h2 id="texto_titulo"></h2>
            <img src="https://media.tenor.com/p2Fs2DoSLWYAAAAM/hello-cute.gif" alt="Gato" id="img" height="200px" style="text-align: center;">
            <br>
            <button class="jump" id="button_1" onclick="redirectToNewPage()">Chi &#129312</button>
            <button id="button_2" >Ño &#128546</button>
            <div id="divForm"></div>
        </div>
    </body>
    <script>

        const imgElement = document.getElementById("img");
        const textElement = document.getElementById("texto_titulo");
        const btn_1 = document.querySelector("#button_1");
        const btn_2 = document.querySelector("#button_2");


        const frases = ["no seas qlo ","di que si","aqui no es"
                            ,"no des click aqui","click aqui si eres gey"
                            ,"aqui nooooooo","es en el otro boton","no te cansas?","No puedo Martha",""];

        const frases2 = ["aqui si","aqui chula","Click aqui para ganar un auto sisi","da click aqui si amas a los perritos"
        ,"click aqui para ver fotos de los bts desnudos omg !!!!!","Heeeeeeey aquiiii","aqui siiiiiiiii"];                    


        const imgs = ["https://i.pinimg.com/originals/c9/02/0a/c9020a6e157290d997a93c037a47e281.gif","https://i.pinimg.com/originals/35/a5/a7/35a5a7cc6f96013d4a8dd8e0af571e7c.gif",
            "https://i.pinimg.com/originals/7d/cc/16/7dcc165beeef87e4b3f31f756ca61ce7.gif","https://i.pinimg.com/originals/4a/ed/d4/4aedd44ab39a02514290e2b05871555f.gif",
            "https://i.pinimg.com/originals/0f/40/87/0f40879be74de324814cc98b2ad2a6ee.gif"
        ];

        const tittles = ["¿Lo hacemos por el chiquito?","¿Me dejas ser Batman?","¿Me diras que quieres comer? hermosura ",
            "¿Vas a escojer la peli? ","Cuentame más ... "
        ];

        const functions = [moveButton,resizeButtons,moveButton,ocultarBoton];

        function getParams(){
            const params = new URLSearchParams(window.location.search);

            return{
                opt: params.get("opt")
            };
        }

        document.addEventListener("DOMContentLoaded",()=>{

            const {opt} = getParams();

            if(!isValid(opt)){

                textElement.innerText = "Ups! opción no valida";

                btn_1.remove();
                btn_2.remove();
                return;
            }

            imgElement.src = imgs[opt];
            textElement.innerText = tittles[opt] + "🥰";

            if(opt === "4"){
                createForm();
                return;
            }
            
            btn_2.addEventListener("click",funButton);

        });

        function funButton(){
            const {opt} = getParams();

            if(isValid(opt)){
                functions[opt]();
                return;
            }
        }

        function moveButton() {

            container = document.querySelector('.container');
            
            var randomX = Math.floor(Math.random() * (container.clientWidth - btn_2.clientWidth) + 10);
            var randomY = Math.floor(Math.random() * (container.clientHeight - btn_2.clientHeight) + 10);
            
            btn_2.style.position = 'absolute';
            btn_2.style.left = randomX + 'px';
            btn_2.style.top = randomY + 'px';

            randomPhrase();
        }


        function ocultarBoton() {
            
            btn_2.style.display = 'none'; 

            btn_1.innerText = frases2[Math.floor(Math.random() * 6) + 1] + "😻";
            var currentSize = parseFloat(window.getComputedStyle(btn_1).fontSize);
            var newSize = currentSize * 1.9; 
            btn_1.style.fontSize = newSize + 'px';
            
        }

        function resizeButtons() {

            var currentSize = parseFloat(window.getComputedStyle(btn_1).fontSize);
            var newSize = currentSize * 1.7; 
            btn_1.style.fontSize = newSize + 'px';

            currentSize = parseFloat(window.getComputedStyle(btn_2).fontSize);
            newSize = currentSize * 0.7; 
            btn_2.style.fontSize = newSize + 'px';

            randomPhrase();
        }
        
        function randomPhrase(){
            var randomNumber = Math.floor(Math.random() * 8) + 1;
            var randomNumber2 = Math.floor(Math.random() * 6) + 1
            btn_2.innerText = frases[randomNumber] + "👀";
            btn_1.innerText = frases2[randomNumber2] + "😻";
        }

        
        function redirectToNewPage() {
            const {opt} = getParams();
            window.location.href = `opcion1S.html?opt=${encodeURIComponent(opt)}`;

        }

        function isValid(option){
            return option != null && option >= 0 && option <= 4; 
        }
        
        function createForm(){
            btn_1.remove();
            btn_2.remove();

            const divForm = document.querySelector("#divForm");
            divForm.classList.add("form-container");
            divForm.innerHTML = `
                <form id="form" method="get" action="opcion1S.html">
                    <div>
                        <label>Cual es tu idea?</label>
                        <input type="text" id="idea" name="idea" placeholder="Describe tu idea">
                        <p id="ideaError"></p>
                    </div>
                    <div>
                        <label>Para cuando?</label>
                        <input type="date" name="fecha" id="fecha">
                        <p id="fechaError"></p>
                    </div>
                    <input type="number" name="opt" value="4" style="display: none;">
                    <input type="submit" value="Enviar">
                </form>
            `;

            const form = document.querySelector("#form");
            form.addEventListener("submit",validateForm);
        }
        
        function validateForm(e){

            e.preventDefault();

            const idea = document.querySelector("#idea").value;
            const fechaInput = document.querySelector("#fecha");
            const fechaValue = new Date(fechaInput.value);
            const fechaActual = new Date();

            let errors = 0;
            
            if(idea == null || idea.trim() === "" || idea.length < 10){
                errors++;
                showError("ideaError","Ingresa una plan valido !");    
            }

            if(fechaInput == null || fechaInput.value === ""){
                errors++;
                showError("fechaError","La fecha no puede estar vacia!");
            }else if(fechaValue < fechaActual){
                errors++;
                showError("fechaError","La fecha no puede ser anterior a la actual!");

            }

            if(errors > 0){
                textElement.innerText = "No sea tonto por favor ! 👀";
                imgElement.src = "https://i.pinimg.com/originals/fb/12/dd/fb12dd7f542f22d146fa095b665fa8ad.gif";

                const {opt} = getParams();
                setTimeout(()=>{
                    textElement.innerText = tittles[opt] + "🥰";
                    imgElement.src = imgs[opt];
                },4000);

                return;
            }
            this.submit();
        }

        function showError(id,message){
            const error = document.getElementById(id);
            error.classList.add('error-message');
            error.textContent = message;

            setTimeout(()=>{
                error.classList.remove("error-message");
                error.textContent = "";
            },4000);
        }


    </script>
</html>
