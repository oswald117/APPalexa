<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Has Ganado!</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1 id="titulo_final"></h1>
    </header>
    <div class="container">
        <img src="https://media.tenor.com/p2Fs2DoSLWYAAAAM/hello-cute.gif" height="200px" style="text-align: center;" alt="Gato ganador" id="ganador" >
        <h2 id="resultFinal">Text default</h2>
        <button id="btn" >Hazme saber tu respuesta </button>
    </div>

    <script>
        const tittles = [
            "Preparate para los besitos ","Preparate para los vergazos con Batman ","Preparate para el chisme ",
            "Yo pongo las palomitas tu pon la cola ","Tu di el plan yo te sigo al infinito y más alla "
        ];

        const texts = [
            "No sera por el chiquito pero si con mucho amor ","Tu seras mi robin y yo la verganza ","Sere todo oidos y como una amiga chismosa alv ",
            "Veremos tu peli favorita y a la vez nos daremos besitos ","Tengo la idea de : "
        ];

        const options = ["Hacer el delicioso sisisi ","Jugar videojuegos yupiii","Echar chisme y comer rico","Ver una peli sisis","Un plan propioo sisis"];

        const img = document.querySelector("#ganador");
        const tittle = document.getElementById("titulo_final");
        const text = document.getElementById("resultFinal");
        const btn = document.querySelector("#btn");

        function getParamsFinal(){
            const params = new URLSearchParams(window.location.search);

            return{
                opt: params.get("opt")
            };
        }
        function getParamsForm(){
            const params = new URLSearchParams(window.location.search);
            return {
                idea:params.get("idea"),
                fecha:params.get("fecha")
            };
        }

        document.addEventListener("DOMContentLoaded",()=>{

            const {opt} = getParamsFinal();
            const {idea,fecha} = getParamsForm();

            if(opt == null || opt < 0 || opt > 4){

                tittle.textContent = "Ups opción erronea";
                text.remove();
                btn.remove();
                return;
            }

            if(opt === "4" && idea != null && fecha != null){
                text.textContent = texts[opt] + idea + "😘";
                btn.onclick = shareForm;
            }else{
                text.textContent = texts[opt] + "😘";
                btn.onclick = compartirTexto;
            }

            img.src = "https://i.pinimg.com/originals/57/f2/51/57f25101a51765e5e03c4176dd5118ca.gif";
            tittle.textContent = tittles[opt] + "🥰"
            
            
            
        });

        function compartirTexto() {
            const{opt} = getParamsFinal();
            finalOpt = options[opt] + "😘";
            window.location.href = `https://api.whatsapp.com/send?text=Tengo la idea de ... :%20${finalOpt}`;

        }

        function shareForm(){
            const{idea,fecha} = getParamsForm();
            var ideaFinal  = idea + "😘";
            
            window.location.href = `https://api.whatsapp.com/send?text=Hola tengo un plan ... :%20${ideaFinal}, el dia :%20${fecha} Qlo si no cumples`;
        }

    </script>
</body>
</html>
